[project]
name = "cinesort"
# v1.5.2-beta - lue depuis VERSION pour build, dupliquee ici pour PEP 621.
# Garder ces deux valeurs synchronisees lors d'un bump (scripts/bump_version.py
# couvre VERSION + ce champ).
version = "1.5.2-beta"
description = "CineSort - tri et renommage automatique de bibliotheques de films (Windows desktop, Python 3.13, pywebview)."
readme = "README.md"
license = {text = "MIT"}
# v77 M-08 (ARCH-03) : remplace le placeholder <PROJECT_AUTHOR>.
authors = [
    {name = "Thomas", email = "blanc.thomas.paty@gmail.com"},
]
# Pin strict Python 3.13.* aligne sur runtime cible (PyInstaller bundle utilise
# l'embedded 3.13). Ne pas elargir sans valider la matrice CI windows-latest.
requires-python = "==3.13.*"
keywords = ["movies", "library", "renaming", "tmdb", "perceptual-quality", "windows"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Win32 (MS Windows)",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Operating System :: Microsoft :: Windows",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.13",
    "Topic :: Multimedia :: Video",
]

# v77 M-08 (ARCH-03) : migration des requirements*.txt vers pyproject [project.dependencies].
# Les requirements*.txt sont conserves en tant qu'alias pour la compat des workflows CI
# qui font `pip install -r requirements.txt` (migration progressive).
# Source de verite : ce bloc. requirements.txt doit etre synchronise lors d'un bump.
dependencies = [
    "pywebview>=6.2.1,<7",
    "requests>=2.34.2",
    # urllib3 epingle pour CVE-2024-37891 (fuite Proxy-Authorization sur redirect)
    # et CVE-2025-66418 (zip bomb decompression). < 3.0 par compat requests.
    "urllib3>=2.7.0,<3.0.0",
    "segno>=1.6.6",
    "rapidfuzz>=3.14.5",
    "numpy>=2.0",
    "onnxruntime>=1.26.0,<2.0",
    # zipp epingle Snyk (CVE chain).
    "zipp>=3.23.1",
]

[project.optional-dependencies]
# dev : alignement strict sur requirements-dev.txt. pre-commit, ruff, coverage,
# pytest (+ hypothesis + import-linter pour les contracts).
dev = [
    "playwright>=1.60.0,<2",
    "Pillow>=12.2",
    "ruff>=0.15.14,<0.16",
    "coverage>=7.14.0,<8",
    "pre-commit>=4.6.0,<5",
    "pytest>=9.0.3,<10",
    "pytest-cov>=5.0",
    "hypothesis>=6.152.9,<7",
    "import-linter>=2.0,<3",
]
# build : pyinstaller + Pillow (alignement avec requirements-build.txt).
build = [
    "pyinstaller>=6.20.0",
    "pillow>=12.2",
]

[project.urls]
Homepage = "https://github.com/Thomas05000005/CineSort"
Repository = "https://github.com/Thomas05000005/CineSort"
Issues = "https://github.com/Thomas05000005/CineSort/issues"

# v77 M-08 : declare cinesort comme un package importable (utilise pour les
# tests d'import editable `pip install -e .` valide par tests/test_pip_install_editable_v77.py).
[tool.setuptools]
packages = ["cinesort"]
include-package-data = false

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.ruff]
target-version = "py313"
line-length = 120
extend-exclude = [
  ".git",
  ".venv",
  ".venv313",
  "venv",
  "build",
  "dist",
  "packages",
  "__pycache__",
  ".tmp_test",
  ".tmp_audit",
  ".ui_backups",
  "archive_ui_next_20260308",
  "web_next_zero",
  # Scripts d'audit visuel manuel (Playwright capture, pas de la prod)
  "tests/manual",
]

[tool.ruff.lint]
# Audit B3 : elargissement progressif. Les regles E/W (pycodestyle), F
# (pyflakes), et UP024/UP032/UP034 (pyupgrade bas risque) attrapent les
# bugs latents sans demander de refactoring massif. E501 (line-too-long)
# et la majorite des UP restent ignores pour ne pas noyer le CI.
# v7.8.0 Phase 14 : activation progressive de regles sans violation (29 fixes
# automatiques deja appliques) — empeche toute regression future sur ces idiomes.
select = [
  "E", "F", "W",
  "UP015", "UP024", "UP032", "UP034",
  "SIM105",  # try/except/pass -> contextlib.suppress
  "SIM110",  # reimplemented-builtin (any/all) -> use builtin
  "SIM117",  # multiple-with -> combined with statement
]
ignore = [
  "E501",  # line-too-long : line-length 120 parfois depasse, non-bloquant
  "E402",  # module-level import not at top — quelques cas legitimes (lazy)
  "E701",  # multi-statement on one line colon — peu de cas
  "E702",  # multi-statement semicolon — peu de cas
  "E741",  # ambiguous variable name (l, I, O) — legacy accepte
  "E721",  # type comparison avec == au lieu de isinstance — 3 cas legitimes
  "E731",  # lambda assignment — 2 cas
]

[tool.ruff.lint.per-file-ignores]
# Les tests E2E Playwright instancient des page objects en variables locales
# que Python garde en vie par ref au frame ; l'analyse statique F841 ne voit
# pas l'usage. On whitelist F841 pour ces fichiers.
"tests/e2e/**/*.py" = ["F841"]
"tests/e2e_dashboard/**/*.py" = ["F841"]
"tests/e2e_desktop/**/*.py" = ["F841"]

# v1.0.0-beta : les tests utilisent souvent des nested `with mock.patch.object`
# pour la lisibilite (1 patch par ligne >> long tuple `with A, B, C:`). SIM117
# n'apporte pas de gain de qualite ici, juste du churn.
# Les tests utilisent aussi parfois try/except Exception/pass legitimement
# (cleanup defensif sur conn.close, etc.) — SIM105 ignore.
"tests/**/*.py" = ["SIM105", "SIM117"]

# app.py contient des try/except Exception/pass defensifs autour de pywebview
# (splash.destroy() peut crasher si la fenetre est deja detruite — c'est OK).
# Pas une candidate pour contextlib.suppress.
"app.py" = ["SIM105"]

[tool.coverage.run]
branch = false
omit = [
  "tests/*",
  ".venv/*",
  ".venv313/*",
  "build/*",
  "dist/*",
  "packages/*",
  ".tmp_test/*",
  ".tmp_audit/*",
]

[tool.coverage.report]
skip_empty = true
show_missing = true
precision = 1
exclude_lines = [
  "pragma: no cover",
  "if __name__ == .__main__.:",
]
