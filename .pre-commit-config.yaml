repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
        files: ^(cinesort|tests|scripts)/.*\.py$
      - id: end-of-file-fixer
        files: ^(cinesort|tests|scripts)/.*\.py$
      - id: check-yaml
      - id: check-toml

  - repo: https://github.com/astral-sh/ruff-pre-commit
    # ALIGNE SUR LA CI (2026-08-02). Trois versions de ruff coexistaient :
    # ce hook en 0.15.6, uv.lock en 0.15.16, et la CI qui resolvait 0.15.22 via
    # une borne flottante. Un developpeur formatait donc localement avec une
    # version que la CI rejetait ensuite. Ces trois points doivent monter
    # ENSEMBLE, avec le reformatage dans le meme commit.
    rev: v0.16.1
    hooks:
      - id: ruff
        name: ruff check
        args: [--config=pyproject.toml]
        files: ^(cinesort|tests|scripts)/.*\.py$
      - id: ruff-format
        name: ruff format
        args: [--config=pyproject.toml]
        files: ^(cinesort|tests|scripts)/.*\.py$
