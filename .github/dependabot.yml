version: 2
updates:
  # Dependances Python (requirements*.txt)
  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
      timezone: "Europe/Paris"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "python"
    commit-message:
      prefix: "deps"
      include: "scope"
    # Laisser passer tous les patches : ils contiennent souvent des
    # correctifs CVE silencieux (pas toujours flagges security advisory
    # par GitHub). L'auto-merge gere le bruit cote CI.
    groups:
      # Groupe les bumps mineurs des libs HTTP en une seule PR pour
      # reduire le bruit.
      http-clients:
        patterns:
          - "requests"
          - "urllib3"
        update-types:
          - "minor"

  # GitHub Actions (workflows/*.yml)
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
      timezone: "Europe/Paris"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "github-actions"
    commit-message:
      prefix: "ci"
