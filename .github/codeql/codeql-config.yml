# Configuration CodeQL de CineSort.
#
# Elle existe pour UNE raison : charger le model pack local
# `.github/codeql/qlpack.yml`, qui declare `scrub_secrets` comme barriere
# d'assainissement. Sans lui, CodeQL voit une chaine sensible atteindre une
# ecriture fichier et leve `py/clear-text-storage-sensitive-data` alors que le
# secret a ete retire juste avant.
#
# `queries` REPREND ce que le workflow demandait auparavant en ligne
# (`queries: +security-extended`) : deplacer la configuration ici sans le
# recopier reviendrait a DESACTIVER les requetes etendues en silence — le genre
# de regression qu'aucun test ne verrait.
name: "CineSort"

queries:
  - uses: security-extended

packs:
  python:
    - cinesort/python-models
