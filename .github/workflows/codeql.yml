name: "CodeQL"

# SAST officiel GitHub : detecte vulnerabilites securite Python + JS
# Tourne a chaque push/PR main + planifie hebdomadaire pour rattraper
# les nouveaux patterns ajoutes par GitHub au fil du temps.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # Lundi 03h24 UTC (decalage exact pour eviter peak hours)
    - cron: "24 3 * * 1"
  workflow_dispatch:

permissions:
  actions: read
  contents: read
  security-events: write

concurrency:
  # Un nouveau push sur une PR rend le run precedent sans objet : on l'annule
  # au lieu de le laisser occuper un slot. Mesure du 2026-08-03 : 247 runs
  # perimes sur 999 en file, pour 16 slots d'execution.
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  # Sur main, au contraire, on laisse le run aller au bout : c'est la reference.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  analyze:
    name: Analyze ${{ matrix.language }}
    runs-on: ubuntu-latest
    timeout-minutes: 30

    strategy:
      fail-fast: false
      matrix:
        language: ["python", "javascript-typescript"]

    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - name: Initialize CodeQL
        uses: github/codeql-action/init@9e0d7b8d25671d64c341c19c0152d693099fb5ba # v4
        with:
          languages: ${{ matrix.language }}
          # security-extended : requetes additionnelles au-dela du default
          # (utile sur du code Python qui manipule fichiers/subprocess/REST)
          queries: +security-extended

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@9e0d7b8d25671d64c341c19c0152d693099fb5ba # v4
        with:
          category: "/language:${{ matrix.language }}"
