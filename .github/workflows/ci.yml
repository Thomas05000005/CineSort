name: CI

# Declencheurs : push sur main + pull requests vers main + lancement manuel
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# OpenSSF Scorecard : top-level permissions explicites = read-only.
# Aucun job de ce workflow n'a besoin d'ecrire (juste lint + tests + coverage).
permissions:
  contents: read

concurrency:
  # Un nouveau push sur une PR rend le run precedent sans objet : on l'annule
  # au lieu de le laisser occuper un slot. Mesure du 2026-08-03 : 247 runs
  # perimes sur 999 en file, pour 16 slots d'execution.
  # `github.sha` et NON `github.ref` pour les evenements hors PR : chaque commit
  # de `main` obtient ainsi son PROPRE groupe, donc deux runs de `main` ne
  # peuvent jamais s'annuler l'un l'autre — quelle que soit la facon dont
  # `cancel-in-progress` est evalue.
  #
  # Mesure du 2026-08-04 : le run du commit ca85b282 (evenement `push`) a ete
  # ANNULE alors que `cancel-in-progress` valait l'expression
  # `github.event_name == 'pull_request'`, donc `false` pour un push. Le
  # commentaire ci-dessous promet pourtant « sur main on laisse le run aller au
  # bout : c'est la reference ». Il ne le faisait pas.
  #
  # Consequence concrete : relancer un ancien run de `main` le remet dans le
  # groupe `CI-refs/heads/main` et tue le run du commit le PLUS RECENT — l'etat
  # de reference de `main` devient alors inexploitable, ce qui est exactement le
  # signal sur lequel s'appuie le suivi de la cascade.
  #
  # Le comportement voulu pour les PR est INCHANGE : `pull_request.number` reste
  # la clef, donc un nouveau push sur une PR annule toujours son run precedent.
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
  # Sur main, au contraire, on laisse le run aller au bout : c'est la reference.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Job dedie a la generation/validation de uv.lock.
  # V1.1 uv : centralise la verification du lockfile pour eviter le drift
  # entre les workflows et la machine du dev. Si uv.lock n'existe pas
  # dans le repo, ce job le genere et l'upload en artefact (a committer
  # ensuite manuellement). Si present, il sert de base au cache uv.
  uv-lock:
    name: Generate/Verify uv.lock
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout du depot
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6

      - name: Setup Python 3.13
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6
        with:
          python-version: "3.13"

      - name: Setup uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          cache-dependency-glob: |
            **/requirements*.txt
            **/pyproject.toml
            **/uv.lock

      - name: Run uv lock
        shell: bash
        run: uv lock

      - name: Upload uv.lock artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: uv-lock
          path: uv.lock
          retention-days: 14

  # Garde-fou de syntaxe du front.
  #
  # Ce job existe parce que `node --check` MENTAIT. Mesure du 2026-08-03
  # (Node v24.14.1, depot sans package.json) : en injectant `const BROKEN = ;`
  # dans chacun des 48 `.js` de `web/dashboard/`, 47 sortaient quand meme en 0.
  # Ce sont des modules ESM ; sans `package.json` declarant `"type": "module"`,
  # la detection de syntaxe de module de Node s'interpose et le processus sort
  # en 0 sans jamais reverifier la source dans le goal « module ». Seul
  # `bootstrap-debug.js` (IIFE, sans import ni export, charge par un
  # `<script src>` classique) etait reellement verifie. Une vingtaine de bilans
  # internes citaient ce `node --check` comme preuve de validite du JS : ces
  # preuves etaient nulles.
  #
  # `scripts/check_js_syntax.mjs` impose le goal explicitement (`--input-type`,
  # source sur stdin), derive ce goal de la maniere dont chaque fichier est
  # reellement charge par le navigateur, et s'auto-teste par canaris avant de
  # conclure. Code 1 = erreur de syntaxe ; code 2 = l'outil ne se fait plus
  # confiance (il refuse alors de verdir).
  js-syntax:
    name: Syntaxe JS (web/)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout du depot
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6

      - name: Setup Node 22
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"

      # Auto-test d'abord : si les canaris ne detectent plus rien, autant le
      # savoir avant de lire un « tout va bien » qui ne voudrait rien dire.
      - name: Auto-test du verificateur (canaris)
        run: node scripts/check_js_syntax.mjs --self-test

      - name: Verification de syntaxe des sources de web/
        run: node scripts/check_js_syntax.mjs

  ci:
    name: Lint, Tests, Build
    runs-on: windows-latest

    steps:
      # 1. Recuperation du code source
      - name: Checkout du depot
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6

      # 2. Installation de Python 3.13
      - name: Setup Python 3.13
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6
        with:
          python-version: "3.13"

      # 2b. Installation de uv (resolveur Python rapide, drop-in pip).
      # README continue de documenter pip pour les utilisateurs finaux ;
      # uv accelere uniquement la CI (resolution + install 10x plus rapide).
      - name: Setup uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          cache-dependency-glob: |
            **/requirements*.txt
            **/pyproject.toml
            **/uv.lock

      # 4. Installation des dependances via uv (CI2 audit : lire les requirements
      # files au lieu de pin a la main pour eviter les drift CI/local).
      # uv pip install --system : drop-in pip dans l'environnement systeme du runner.
      - name: Installation des dependances
        shell: pwsh
        run: |
          uv pip install --system -r requirements.txt -r requirements-dev.txt -r requirements-build.txt
          uv pip install --system pytest pytest-playwright import-linter

      # 5. Verification du lint (regles E9, F — bloquant)
      - name: Lint (ruff check)
        shell: pwsh
        run: python -m ruff check .

      # 6. Verification du formatage (bloquant, sans modification)
      - name: Format check (ruff format)
        shell: pwsh
        run: python -m ruff format --check .

      # 6b. Issue #83 phase A8 : verifier les contracts d'architecture en couches
      # (domain ne doit pas importer app/infra/ui, etc.) via import-linter.
      # Configuration : .importlinter a la racine. Si une regression rajoute un
      # import inter-couches interdit, ce check echoue.
      - name: Architecture contracts (import-linter)
        shell: pwsh
        run: lint-imports

      # 6c. Navigateur Playwright pour les tests runtime de `tests/` (2026-08-03).
      #
      # Le commentaire ci-dessous supposait que TOUS les tests navigateur vivaient
      # dans tests/e2e*. Ce n'est plus vrai : 46 tests parametres `[chromium]`
      # (contraste WCAG, invariantes de couleurs de tier, libelles UTF-8, cycles
      # de toast et de countdown, arret des pollers au unmount) vivent dans
      # `tests/` et sont donc DANS le perimetre de ce job. Sans navigateur ils
      # echouaient tous au setup — 46 ERROR qui faisaient echouer l'etape des
      # tests, et masquaient les vrais echecs.
      # `--only-shell` suffit : ces tests tournent en headless.
      - name: Navigateur Playwright (tests runtime de tests/)
        shell: pwsh
        run: python -m playwright install chromium --only-shell

      # 7. Execution des tests avec mesure de couverture (unitaires + tests
      # runtime headless de `tests/` — les E2E dashboard/desktop restent
      # exclus et sont traites apres le build).
      #
      # v1.0.0-beta : pollution inter-tests resolue (issue #4).
      # Cause root : test_import_cycle_guard manipulait sys.modules ce qui
      # cassait les caches module-level (lru_cache, dict globals) des tests
      # suivants. Fix : subprocess pour l'import check.
      - name: Tests unitaires avec couverture
        shell: pwsh
        run: |
          python -m coverage run -m pytest tests/ `
            --ignore=tests/e2e --ignore=tests/e2e_dashboard --ignore=tests/e2e_desktop `
            --ignore=tests/manual --ignore=tests/live --ignore=tests/stress `
            -v

      # 8. Rapport de couverture — echec si < 75%
      # Note : seuil temporairement baisse de 80 a 75 suite a la migration B
      # (PR #257) qui a supprime ~50 tests legacy frontend (couvraient web/index.html,
      # styles.css, components/*.js). La couverture remontera quand les nouveaux
      # tests dashboard seront ajoutes en Phase 2/3 de la refonte UI.
      - name: Rapport de couverture (seuil 75%)
        shell: pwsh
        run: python -m coverage report --fail-under=75

      # Le seuil ci-dessus est GLOBAL : un module tres bas s'y noie dans la
      # moyenne. MESURE sur les modules qui deplacent et renomment les films de
      # l'utilisateur — avant cette branche, puis apres :
      #
      #   move_journal.py       97,3 %  ->  97,3 %
      #   disk_space_check.py   92,4 %  ->  92,4 %
      #   apply_core.py         75,2 %  ->  75,1 %
      #   apply_support.py      61,7 %  ->  83,0 %   (etait SOUS le seuil global)
      #   apply_rollback.py     60,9 %  ->  61,5 %   (toujours sous le seuil global)
      #
      # Les deux derniers passaient donc sous 75 % sans rien faire rougir, et
      # `apply_rollback` — le code qui defait un apply rate — y reste. Ce second
      # controle est un CLIQUET a marge zero : chaque plancher est la mesure du
      # jour arrondie a l'entier inferieur. Il n'exige pas d'ecrire des tests
      # aujourd'hui, il interdit de reculer.
      #
      # Un echec ici ne veut donc PAS dire « pas assez de tests » mais « la
      # couverture d'un chemin destructif a BAISSE » : soit du code a ete ajoute
      # sans test, soit un test a ete retire. Monter un plancher est une ligne de
      # diff visible en review ; le baisser doit se justifier.
      - name: Couverture des chemins destructifs (cliquet par module)
        shell: pwsh
        run: |
          python -m coverage report --fail-under=97 --include="cinesort/app/move_journal.py"
          python -m coverage report --fail-under=92 --include="cinesort/app/disk_space_check.py"
          python -m coverage report --fail-under=75 --include="cinesort/app/apply_core.py"
          python -m coverage report --fail-under=83 --include="cinesort/ui/api/apply_support.py"
          python -m coverage report --fail-under=61 --include="cinesort/app/apply_rollback.py"

      # 9. Generation du rapport coverage HTML (telechargeable depuis Actions)
      - name: Rapport coverage HTML
        shell: pwsh
        run: python -m coverage html -d coverage_html

      # 9b. Generation rapport XML pour Codecov
      - name: Rapport coverage XML (pour Codecov)
        shell: pwsh
        run: python -m coverage xml -o coverage.xml

      # 9c. Upload vers Codecov (tracking dans le temps + badge)
      # Pas bloquant : si Codecov est down ou pas configure (token absent),
      # on continue. Public repos beneficient de tokenless uploads.
      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@e79a6962e0d4c0c17b229090214935d2e33f8354 # v6.0.1
        with:
          files: coverage.xml
          flags: unittests
          name: cinesort-coverage
          fail_ci_if_error: false
          verbose: false
          token: ${{ secrets.CODECOV_TOKEN }}  # Optional pour public repos

      # 10. Upload du rapport coverage HTML (retention 14 jours)
      - name: Upload artefact coverage
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: coverage-report
          path: coverage_html/
          retention-days: 14

      # 11. Build complet PyInstaller (option A — detecte les imports manquants)
      - name: Build PyInstaller
        shell: pwsh
        run: pyinstaller --noconfirm CineSort.spec

      # 12. Verification de la taille de l'EXE — echec si > 60 MB
      # Limite portee de 20 MB a 60 MB suite a integration moteur perceptuel V2 :
      # - LPIPS AlexNet ONNX (~9 MB)
      # - onnxruntime (~30 MB)
      # - numpy (~15 MB)
      # - ffmpeg/ffprobe/mediainfo embarques
      # Bundle actuel mesure ~51 MB. Marge 60 MB pour absorber les evolutions.
      - name: Verification taille EXE (max 60 MB)
        shell: pwsh
        run: |
          $exe = "dist\CineSort.exe"
          if (-not (Test-Path $exe)) {
            Write-Error "EXE introuvable : $exe"
            exit 1
          }
          $size = (Get-Item $exe).Length
          $sizeMB = [math]::Round($size / 1MB, 2)
          Write-Host "Taille de l'EXE : $sizeMB MB"
          if ($size -gt 60MB) {
            Write-Error "EXE trop volumineux : $sizeMB MB (limite : 60 MB)"
            exit 1
          }
          Write-Host "OK — sous la limite de 60 MB"

      # 13. Upload de l'artefact EXE (retention 7 jours)
      - name: Upload artefact EXE
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: CineSort-exe
          path: dist/CineSort.exe
          retention-days: 7
          if-no-files-found: error

      # 14. Tests E2E dashboard (Playwright pur, pas de pywebview)
      # v1.0.0-beta : --timeout retire (pytest-timeout pas installe).
      # -x : stop au 1er fail (rapide).
      - name: Tests E2E Dashboard
        shell: pwsh
        run: |
          uv pip install --system pytest-playwright pytest-timeout
          playwright install chromium
          python -m pytest tests/e2e/ -v --timeout=120 -x
        if: success()
        continue-on-error: true  # Non bloquant tant que les fixtures E2E sont en cours de stabilisation

      # E2E desktop : necessite pywebview + Windows GUI → executer localement
      # pytest tests/e2e_desktop/ -v --timeout=600
