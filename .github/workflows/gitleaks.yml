name: gitleaks

# Detection secrets accidentellement commit (tokens API, mots de passe,
# cles privees, DPAPI blobs, etc.). Critique vu que CineSort manipule
# secrets DPAPI (TMDb, Jellyfin, Plex, Radarr, SMTP).
#
# Gitleaks v8 utilise ~150 patterns built-in + extensions custom possible
# via .gitleaks.toml.

# PORTEE DU SCAN — a lire avant d'interpreter un resultat (#996).
#
# `gitleaks-action` ne scanne PAS l'arbre livre : il scanne une PLAGE DE
# COMMITS, et la plage depend de l'evenement.
#
#     pull_request      --log-opts=<plage de commits de la PR>
#     push              plage before..after du push
#     workflow_dispatch AUCUNE plage -> tout l'historique
#
# Trois consequences, chacune ayant deja coute une enquete :
#
# 1. Un run vert sur `main` ne dit rien de l'HISTORIQUE, seulement des commits
#    du push. Les 60 premiers runs verts de ce workflow ont ete lus comme
#    « le depot est propre » ; personne n'avait regarde.
#
# 2. Une fausse cle corrigee au commit SUIVANT laisse le run ROUGE : le commit
#    fautif est toujours dans la plage. Il faut ECRASER le commit (squash /
#    amend), pas ajouter un correctif par-dessus.
#
# 3. `git log -p` inclut les MESSAGES de commit, qui sont donc scannes aussi.
#    Decrire un secret detecte en le RECOPIANT dans le message le reintroduit
#    dans la plage scannee.
#
# PREMIER SCAN COMPLET, declenche manuellement le 2026-08-06 : `leaks found: 57`.
# Les 57 ont ete verifies un par un — AUCUN n'est un vrai secret. Ce sont des
# exemples de documentation (10 dans docs/api/ENDPOINTS.md), des captures de
# sortie de tests (32 dans docs/internal/r8/) et des fixtures de tests portant
# des valeurs hexadecimales evidemment factices.
#
# Le seul en code de PRODUCTION est `app.py:248`, ou la regle `generic-api-key`
# s'est declenchee sur un INTERVALLE EN SECONDES — une multiplication de minutes
# par soixante, dont l'entropie mesuree atteint 3,50.
#
# Ces valeurs ne sont volontairement pas recopiees ici : d'apres le point 3
# ci-dessus, ce fichier et le message de commit qui l'introduit sont eux-memes
# dans la plage scannee.
#
# Aucune suppression n'a donc ete ajoutee : un `.gitleaksignore` cacherait aussi
# les vrais secrets futurs aux memes emplacements.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # Un nouveau push sur une PR rend le run precedent sans objet : on l'annule
  # au lieu de le laisser occuper un slot. Mesure du 2026-08-03 : 247 runs
  # perimes sur 999 en file, pour 16 slots d'execution.
  # `github.sha` et NON `github.ref` pour les evenements hors PR : chaque commit
  # de `main` obtient ainsi son PROPRE groupe, donc deux runs de `main` ne
  # peuvent jamais s'annuler l'un l'autre — quelle que soit la facon dont
  # `cancel-in-progress` est evalue.
  #
  # Mesure du 2026-08-04 : le run du commit ca85b282 (evenement `push`) a ete
  # ANNULE alors que `cancel-in-progress` valait l'expression
  # `github.event_name == 'pull_request'`, donc `false` pour un push. Le
  # commentaire ci-dessous promet pourtant « sur main on laisse le run aller au
  # bout : c'est la reference ». Il ne le faisait pas.
  #
  # Consequence concrete : relancer un ancien run de `main` le remet dans le
  # groupe `CI-refs/heads/main` et tue le run du commit le PLUS RECENT — l'etat
  # de reference de `main` devient alors inexploitable, ce qui est exactement le
  # signal sur lequel s'appuie le suivi de la cascade.
  #
  # Le comportement voulu pour les PR est INCHANGE : `pull_request.number` reste
  # la clef, donc un nouveau push sur une PR annule toujours son run precedent.
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
  # Sur main, au contraire, on laisse le run aller au bout : c'est la reference.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  scan:
    name: Scan secrets
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6
        with:
          fetch-depth: 0  # Pour scanner l'historique complet

      - name: gitleaks
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Plus de bruit si on log les findings (utile pour audit
          # post-mortem mais sans donner les valeurs en clair). Ne
          # bloque QUE sur findings nouveaux non whitelistes.
          GITLEAKS_ENABLE_COMMENTS: true
          GITLEAKS_ENABLE_SUMMARY: true
