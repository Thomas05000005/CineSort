name: windows-ci

on:
  push:
  pull_request:
  workflow_dispatch:

# OpenSSF Scorecard : top-level permissions explicites = read-only.
# Aucun job de ce workflow n'a besoin d'ecrire.
permissions:
  contents: read

jobs:
  verify:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v6

      - name: Setup Python 3.13
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6
        with:
          python-version: "3.13"

      - name: Setup uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          cache-dependency-glob: |
            **/requirements*.txt
            **/pyproject.toml
            **/uv.lock

      - name: Install dev and build dependencies
        shell: pwsh
        run: |
          uv pip install --system -r requirements-dev.txt -r requirements-build.txt

      - name: Install Playwright Chromium
        shell: pwsh
        # `chromium` et `chromium-headless-shell` sont deux telechargements
        # DISTINCTS depuis Playwright 1.49. Cette etape existait deja mais
        # n'installait que le premier : les tests headless de `tests/` cherchent
        # `chrome-headless-shell.exe` et echouaient tous AU SETUP
        # (« Executable doesn't exist [...] Please run playwright install »),
        # ce qui faisait echouer le quality gate sans rapport avec le code.
        run: |
          python -m playwright install chromium chromium-headless-shell

      - name: Standard quality gate
        shell: cmd
        run: check_project.bat

  build:
    needs: verify
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v6

      - name: Setup Python 3.13
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6
        with:
          python-version: "3.13"

      - name: Setup uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          cache-dependency-glob: |
            **/requirements*.txt
            **/pyproject.toml
            **/uv.lock

      - name: Install dev and build dependencies
        shell: pwsh
        run: |
          uv pip install --system -r requirements-dev.txt -r requirements-build.txt

      - name: Build Windows QA and release artifacts
        shell: cmd
        run: build_windows.bat

      - name: Optional code signing
        shell: pwsh
        env:
          WINDOWS_CODESIGN_CERT_BASE64: ${{ secrets.WINDOWS_CODESIGN_CERT_BASE64 }}
          WINDOWS_CODESIGN_CERT_PASSWORD: ${{ secrets.WINDOWS_CODESIGN_CERT_PASSWORD }}
          WINDOWS_CODESIGN_TIMESTAMP_URL: ${{ secrets.WINDOWS_CODESIGN_TIMESTAMP_URL }}
        run: |
          ./scripts/sign_windows_release.ps1 -Paths @(
            "dist/CineSort.exe",
            "dist/CineSort_QA/CineSort.exe"
          )
          python scripts/package_zip.py --qa --release

      - name: Upload Windows build artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: windows-build-artifacts
          path: |
            dist/CineSort.exe
            dist/CineSort_QA/**
            packages/*.zip
            packages/*.sha256
            packages/*.manifest.txt
          if-no-files-found: error
