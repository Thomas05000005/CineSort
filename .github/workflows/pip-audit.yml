name: pip-audit (CVE deps)

# Verifie l'absence de vulnerabilites connues (CVE) dans les
# dependances Python listees dans requirements*.txt.
#
# Localement on l'a lance manuellement en v7.8.0 (0 CVE).
# Ce workflow le rend permanent : a chaque push + chaque lundi
# pour rattraper les nouveaux CVE publies sur PyPI advisory DB.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # Lundi 04h12 UTC : decalage horaire pour eviter peak hours
    - cron: "12 4 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # Un nouveau push sur une PR rend le run precedent sans objet : on l'annule
  # au lieu de le laisser occuper un slot. Mesure du 2026-08-03 : 247 runs
  # perimes sur 999 en file, pour 16 slots d'execution.
  # `github.sha` et NON `github.ref` pour les evenements hors PR : chaque commit
  # de `main` obtient ainsi son PROPRE groupe, donc deux runs de `main` ne
  # peuvent jamais s'annuler l'un l'autre — quelle que soit la facon dont
  # `cancel-in-progress` est evalue.
  #
  # Mesure du 2026-08-04 : le run du commit ca85b282 (evenement `push`) a ete
  # ANNULE alors que `cancel-in-progress` valait l'expression
  # `github.event_name == 'pull_request'`, donc `false` pour un push. Le
  # commentaire ci-dessous promet pourtant « sur main on laisse le run aller au
  # bout : c'est la reference ». Il ne le faisait pas.
  #
  # Consequence concrete : relancer un ancien run de `main` le remet dans le
  # groupe `CI-refs/heads/main` et tue le run du commit le PLUS RECENT — l'etat
  # de reference de `main` devient alors inexploitable, ce qui est exactement le
  # signal sur lequel s'appuie le suivi de la cascade.
  #
  # Le comportement voulu pour les PR est INCHANGE : `pull_request.number` reste
  # la clef, donc un nouveau push sur une PR annule toujours son run precedent.
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
  # Sur main, au contraire, on laisse le run aller au bout : c'est la reference.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  audit:
    name: pip-audit
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v6

      - name: Setup Python 3.13
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v6
        with:
          python-version: "3.13"

      - name: Setup uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          cache-dependency-glob: |
            **/requirements*.txt
            **/pyproject.toml
            **/uv.lock

      - name: Install pip-audit
        # pip-audit conserve pip pour exploiter --requirement (pas equivalent uv).
        run: uv pip install --system "pip-audit>=2.7,<3"

      - name: Audit requirements.txt (production)
        run: pip-audit --requirement requirements.txt --strict

      - name: Audit requirements-build.txt (PyInstaller deps)
        run: pip-audit --requirement requirements-build.txt --strict

      - name: Audit requirements-dev.txt (dev + test deps)
        # Non bloquant : si une dep dev a un CVE qui n'affecte pas la
        # prod, on logue mais on ne bloque pas. Le strict mode reste
        # actif pour requirements.txt et requirements-build.txt.
        continue-on-error: true
        run: pip-audit --requirement requirements-dev.txt
