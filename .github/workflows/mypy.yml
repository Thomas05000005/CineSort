name: mypy (type checking)

# Type checking statique Python.
# Mode "tolerant" pour la v1.0.0-beta : le projet a un mix de code
# annote (recent) et non-annote (legacy v1-v5). mypy s'execute SANS
# --strict et beaucoup de modules sont en --ignore-missing-imports.
#
# Le workflow ne bloque PAS le CI pour l'instant : il fournit un
# signal pour ajouter progressivement des annotations. Une fois la
# dette type-hints reduite, passer en mode strict bloquant.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # Un nouveau push sur une PR rend le run precedent sans objet : on l'annule
  # au lieu de le laisser occuper un slot. Mesure du 2026-08-03 : 247 runs
  # perimes sur 999 en file, pour 16 slots d'execution.
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  # Sur main, au contraire, on laisse le run aller au bout : c'est la reference.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  mypy:
    name: mypy check
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - name: Setup Python 3.13
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6
        with:
          python-version: "3.13"

      - name: Setup uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          cache-dependency-glob: |
            **/requirements*.txt
            **/pyproject.toml
            **/uv.lock

      - name: Install mypy + project deps
        run: |
          uv pip install --system "mypy>=1.13,<2"
          # Installer les deps prod pour que mypy puisse resoudre les types
          # des libs tierces (rapidfuzz, segno, etc.)
          uv pip install --system -r requirements.txt

      - name: Run mypy (informational, non-blocking)
        # Non-bloquant tant que la dette type-hints est reduite.
        # Une fois prete a etre stricte, retirer le `|| true` et
        # ajouter --strict + --warn-unused-ignores.
        run: |
          mypy cinesort/ \
            --ignore-missing-imports \
            --no-strict-optional \
            --pretty \
            --show-error-codes \
            --show-error-context \
            --warn-redundant-casts \
            --check-untyped-defs \
            || true
