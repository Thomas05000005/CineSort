name: mypy (type checking)

# Type checking statique Python.
# Mode "tolerant" pour la v1.0.0-beta : le projet a un mix de code
# annote (recent) et non-annote (legacy v1-v5). mypy s'execute SANS
# --strict et beaucoup de modules sont en --ignore-missing-imports.
#
# Le workflow ne bloque PAS le CI pour l'instant : il fournit un
# signal pour ajouter progressivement des annotations. Une fois la
# dette type-hints reduite, passer en mode strict bloquant.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # Un nouveau push sur une PR rend le run precedent sans objet : on l'annule
  # au lieu de le laisser occuper un slot. Mesure du 2026-08-03 : 247 runs
  # perimes sur 999 en file, pour 16 slots d'execution.
  # `github.sha` et NON `github.ref` pour les evenements hors PR : chaque commit
  # de `main` obtient ainsi son PROPRE groupe, donc deux runs de `main` ne
  # peuvent jamais s'annuler l'un l'autre — quelle que soit la facon dont
  # `cancel-in-progress` est evalue.
  #
  # Mesure du 2026-08-04 : le run du commit ca85b282 (evenement `push`) a ete
  # ANNULE alors que `cancel-in-progress` valait l'expression
  # `github.event_name == 'pull_request'`, donc `false` pour un push. Le
  # commentaire ci-dessous promet pourtant « sur main on laisse le run aller au
  # bout : c'est la reference ». Il ne le faisait pas.
  #
  # Consequence concrete : relancer un ancien run de `main` le remet dans le
  # groupe `CI-refs/heads/main` et tue le run du commit le PLUS RECENT — l'etat
  # de reference de `main` devient alors inexploitable, ce qui est exactement le
  # signal sur lequel s'appuie le suivi de la cascade.
  #
  # Le comportement voulu pour les PR est INCHANGE : `pull_request.number` reste
  # la clef, donc un nouveau push sur une PR annule toujours son run precedent.
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
  # Sur main, au contraire, on laisse le run aller au bout : c'est la reference.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  mypy:
    name: mypy check
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6

      - name: Setup Python 3.13
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v6
        with:
          python-version: "3.13"

      - name: Setup uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          cache-dependency-glob: |
            **/requirements*.txt
            **/pyproject.toml
            **/uv.lock

      - name: Install mypy + project deps
        run: |
          uv pip install --system "mypy>=1.13,<2"
          # Installer les deps prod pour que mypy puisse resoudre les types
          # des libs tierces (rapidfuzz, segno, etc.)
          uv pip install --system -r requirements.txt

      # === CLIQUET (2026-08-29) ====================================
      # Ce check est REQUIS par la protection de `main`. Avant ce jour il ne
      # pouvait pas echouer : le `|| true` avalait tout, et la protection
      # annoncait donc un garde qui n'en etait pas un.
      #
      # Retirer le `|| true` d'un coup aurait rendu `main` rouge : mesure du
      # 2026-08-29, 70 erreurs dans 34 fichiers. On fige le compte et on
      # interdit qu'il MONTE. Une BAISSE echoue aussi, avec le nouveau chiffre
      # a inscrire — un gain non verrouille se reperd.
      #
      # La sortie complete reste affichee : le `|| true` sur mypy est conserve
      # pour que le rapport soit toujours lisible, et c'est le cliquet qui
      # decide du verdict.
      - name: Run mypy + cliquet sur le nombre d'erreurs
        run: |
          mypy cinesort/ app.py \
            --ignore-missing-imports \
            --no-strict-optional \
            --show-error-codes \
            --show-error-context \
            --warn-redundant-casts \
            --check-untyped-defs \
            > mypy-out.txt 2>&1 || true
          cat mypy-out.txt
          python - <<'PY'
          import re, sys

          # PLAFOND = 75, mesure du 2026-08-29 DANS LES CONDITIONS DE CE JOB.
          #
          # Le chiffre a d'abord ete pose a 70, mesure en local par un `uvx mypy`
          # nu. Le cliquet a rougi des sa premiere execution reelle : 75. Ni une
          # regression, ni un bug — TROIS instruments differents pour la meme
          # question :
          #
          #     mypy nu, sur Windows                        70 erreurs / 34 fichiers
          #     + les deps de production installees          59 erreurs / 25 fichiers
          #     + `--platform linux` (le runner)             75 erreurs / 32 fichiers
          #     ce job, sur ubuntu-latest                    75 erreurs / 32 fichiers
          #
          # Les deps changent ce que mypy sait resoudre ; la PLATEFORME change ce
          # qu'il analyse, parce que ce produit est truffe de branches
          # `sys.platform == "win32"` que mypy elague selon la cible. Mesurer
          # depuis un poste Windows repond a une autre question que celle du job.
          #
          # REPRODUIRE CE CHIFFRE, exactement :
          #
          #     uvx --from "mypy>=1.13,<2" --with-requirements requirements.txt \
          #       mypy cinesort/ app.py --platform linux --ignore-missing-imports \
          #       --no-strict-optional --show-error-codes --show-error-context \
          #       --warn-redundant-casts --check-untyped-defs --no-pretty
          #
          # Sans `--platform linux` ET sans les deps, le nombre obtenu ne veut
          # rien dire pour ce cliquet.
          # PERIMETRE ELARGI le 2026-08-31 : `app.py` entre, et le plafond ne
          # bouge PAS.
          #
          # `app.py` fait 1200 lignes, porte le boot desktop et le passage du
          # jeton REST — et echappait a SIX controles statiques a la fois, tous
          # bornes a `cinesort/` : bandit, mypy, le budget de taille de
          # fonction, le cliquet `except OSError`/sqlite, le cliquet d'imports
          # lazy et le contrat de symboles morts.
          #
          # Mesure dans les conditions EXACTES de ce job (commande de
          # reproduction ci-dessus) :
          #
          #     cinesort/ seul                       75 erreurs / 32 fichiers
          #     cinesort/ + app.py                   76 erreurs / 33 fichiers
          #     apres correction de l'unique erreur  75 erreurs / 32 fichiers
          #
          # Cette unique erreur etait un `type: ignore` qui nommait le MAUVAIS
          # code : `app.py:588` portait `[union-attr]` alors que mypy y leve
          # `[attr-defined]` — `splash_window` est type `object`, il n'a donc
          # aucun attribut connu, ce qui n'est pas une union. mypy le disait
          # lui-meme : « Error code "attr-defined" not covered by "type: ignore"
          # comment ». Un ignore qui vise le mauvais code ne couvre rien.
          #
          # `app.py` entre donc dans le perimetre SANS COUT.
          PLAFOND = 75

          texte = open("mypy-out.txt", encoding="utf-8", errors="replace").read()
          m = re.search(r"Found (\d+) errors?", texte)
          if m is None:
              if re.search(r"Success: no issues found", texte):
                  n = 0
              else:
                  sys.exit(
                      "Le rapport mypy n'est pas lisible : ni « Found N errors » "
                      "ni « Success ». Le cliquet ne peut pas se prononcer, et un "
                      "cliquet qui ne sait pas se prononcer doit ECHOUER, pas passer."
                  )
          else:
              n = int(m.group(1))
          print(f"mypy : {n} erreur(s), plafond {PLAFOND}")

          if n > PLAFOND:
              sys.exit(
                  f"REGRESSION : {n} erreurs pour un plafond de {PLAFOND}. "
                  "Corriger, ou (si justifie) monter PLAFOND dans "
                  ".github/workflows/mypy.yml — choix explicite en review."
              )
          if n < PLAFOND:
              sys.exit(
                  f"GAIN A VERROUILLER : {n} erreurs, le plafond en annonce "
                  f"{PLAFOND}. Abaisser PLAFOND a {n} dans "
                  ".github/workflows/mypy.yml pour que ce gain ne se reperde pas."
              )
          PY
