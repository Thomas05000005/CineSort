name: Release Drafter

# Tient un draft de la prochaine release a jour automatiquement.
# Chaque PR mergee sur main ajoute son titre aux release notes du draft.
# Quand vous tagger une release, les notes sont deja pretes.

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, reopened, synchronize]

permissions:
  contents: read

concurrency:
  # Un nouveau push sur une PR rend le run precedent sans objet : on l'annule
  # au lieu de le laisser occuper un slot. Mesure du 2026-08-03 : 247 runs
  # perimes sur 999 en file, pour 16 slots d'execution.
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  # Sur main, au contraire, on laisse le run aller au bout : c'est la reference.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  update_release_draft:
    name: Update release draft
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write  # cree/edite le draft de release
      pull-requests: read

    steps:
      - uses: release-drafter/release-drafter@c2e2804cc59f45f57076a99af580d0fedb697927 # v7.3.0
        with:
          config-name: release-drafter.yml
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
