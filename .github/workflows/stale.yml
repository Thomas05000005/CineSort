name: Mark stale issues and PRs

# Ferme automatiquement les issues/PRs sans activite depuis longtemps.
# Configuration tolerante pour la beta : un gros delai d'inactivite avant de
# tagger "stale", et delai supplementaire avant de fermer.

on:
  schedule:
    # Lundi 08h UTC
    - cron: "0 8 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  stale:
    name: Stale check
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      issues: write
      pull-requests: write

    steps:
      - uses: actions/stale@eb5cf3af3ac0a1aa4c9c45633dd1ae542a27a899 # v10.3.0
        with:
          # ===== Issues =====
          days-before-issue-stale: 60  # 2 mois d'inactivite -> tag stale
          days-before-issue-close: 14  # 2 semaines apres tag stale -> close
          stale-issue-label: "stale"
          stale-issue-message: |
            👋 Cette issue n'a pas eu d'activite depuis 60 jours.

            Elle sera fermee dans 14 jours sans nouveau commentaire.

            **Pour la garder ouverte** : ajoutez un commentaire ou retirez
            le label `stale`. Les issues avec le label `blocked`, `bug`,
            `security` ou `documentation` ne sont jamais fermees.
          close-issue-message: |
            🗄️ Issue fermee automatiquement faute d'activite.

            **N'hesitez pas a la rouvrir** si le sujet est toujours pertinent !

          # Exempt labels : on ne ferme JAMAIS ces issues
          # TOUS CES LABELS EXISTENT — verifie par `test_stale_ne_nomme_que_des_labels_REELS`.
          # Une liste d'exemptions qui nomme un label inexistant donne l'illusion
          # d'un filet : il ne peut structurellement jamais s'appliquer.
          # Mesure du 2026-08-31 : `pinned` etait fantome, et `good-first-issue`
          # aussi — le vrai nom porte des ESPACES (`good first issue`).
          # `pinned` est remplace par `blocked`, qui existe et sert deja.
          exempt-issue-labels: "blocked,security,help-wanted,good first issue,bug,documentation,high-priority"

          # ===== Pull Requests =====
          days-before-pr-stale: 30  # 1 mois -> stale
          days-before-pr-close: 7   # 1 semaine apres -> close
          stale-pr-label: "stale"
          stale-pr-message: |
            👋 Cette PR n'a pas eu d'activite depuis 30 jours.

            Elle sera fermee dans 7 jours. Pour la garder ouverte : commit/
            commentez ou retirez le label `stale`.
          close-pr-message: |
            🗄️ PR fermee automatiquement faute d'activite.

            **Si le travail reprend, vous pouvez la rouvrir** ou en creer une
            nouvelle.

          # `pinned`, `wip` et `work-in-progress` etaient FANTOMES : trois des cinq
          # exemptions ne pouvaient jamais s'appliquer. Elles sont elaguees plutot
          # que creees — `blocked` couvre deja l'intention, et le brouillon a une
          # option NATIVE qui ne depend d'aucun label (voir `exempt-draft-pr`).
          exempt-pr-labels: "blocked,security"

          # Un brouillon est un travail en cours par DEFINITION. C'est ce que
          # `wip`/`work-in-progress` visaient sans y parvenir : cette option-ci
          # ne depend d'aucun label, donc elle ne peut pas devenir fantome.
          exempt-draft-pr: true

          # ===== General =====
          operations-per-run: 100  # max 100 issues/PRs traitees par run
          remove-stale-when-updated: true  # retire stale si commentaire
          delete-branch: true  # supprime la branche apres close PR
          ascending: true  # traite les plus anciennes d'abord
