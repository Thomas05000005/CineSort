name: bandit (SAST Python)

# Bandit : static analysis pour bugs securite Python.
# Detecte try/except large, eval/exec, subprocess shell=True,
# hashlib MD5/SHA1, urllib sans timeout, etc.
#
# Mode "tolerant" pour la v1.0.0-beta : on log les findings sans bloquer
# le CI. Une fois la dette technique reduite, passer en mode strict
# avec --severity-level high pour bloquer les findings HIGH.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  security-events: write

concurrency:
  # Un nouveau push sur une PR rend le run precedent sans objet : on l'annule
  # au lieu de le laisser occuper un slot. Mesure du 2026-08-03 : 247 runs
  # perimes sur 999 en file, pour 16 slots d'execution.
  # `github.sha` et NON `github.ref` pour les evenements hors PR : chaque commit
  # de `main` obtient ainsi son PROPRE groupe, donc deux runs de `main` ne
  # peuvent jamais s'annuler l'un l'autre — quelle que soit la facon dont
  # `cancel-in-progress` est evalue.
  #
  # Mesure du 2026-08-04 : le run du commit ca85b282 (evenement `push`) a ete
  # ANNULE alors que `cancel-in-progress` valait l'expression
  # `github.event_name == 'pull_request'`, donc `false` pour un push. Le
  # commentaire ci-dessous promet pourtant « sur main on laisse le run aller au
  # bout : c'est la reference ». Il ne le faisait pas.
  #
  # Consequence concrete : relancer un ancien run de `main` le remet dans le
  # groupe `CI-refs/heads/main` et tue le run du commit le PLUS RECENT — l'etat
  # de reference de `main` devient alors inexploitable, ce qui est exactement le
  # signal sur lequel s'appuie le suivi de la cascade.
  #
  # Le comportement voulu pour les PR est INCHANGE : `pull_request.number` reste
  # la clef, donc un nouveau push sur une PR annule toujours son run precedent.
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
  # Sur main, au contraire, on laisse le run aller au bout : c'est la reference.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  bandit:
    name: bandit scan
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6

      - name: Setup Python 3.13
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v6
        with:
          python-version: "3.13"

      - name: Setup uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          cache-dependency-glob: |
            **/requirements*.txt
            **/pyproject.toml
            **/uv.lock

      - name: Install bandit
        run: uv pip install --system "bandit[sarif,toml]>=1.7,<2"

      - name: Run bandit
        # -ll : niveau severite LOW minimum
        # -ii : niveau confidence MEDIUM minimum (reduit faux positifs)
        # --skip B101 : "assert detected" (legitimate dans nos tests)
        # --skip B404,B603 : subprocess imports (utilise ffprobe/mediainfo
        #   avec args controles, pas user input)
        # --skip B311 : random pour usages non-cryptos (UI animations)
        # Output SARIF pour integration GitHub Security tab.
        # `|| true` ici est NORMAL : bandit sort non-zero des qu'il trouve quoi
        # que ce soit, et cette etape doit produire le SARIF quoi qu'il arrive.
        # Ce qui BLOQUE est le cliquet plus bas, pas cette etape.
        run: |
          bandit -r cinesort/ \
            --skip B101,B404,B603,B311 \
            -ll -ii \
            -f sarif -o bandit-results.sarif || true

      - name: Upload SARIF
        if: always()
        uses: github/codeql-action/upload-sarif@cdf488f595d80d6e07e03d4674febd5ab45fa938 # v4
        with:
          sarif_file: bandit-results.sarif
          category: bandit

      # === CLIQUET (2026-08-29) ====================================
      # Ce check est REQUIS par la protection de `main`. Avant ce jour il ne
      # pouvait pas echouer : le `|| true` ci-dessus avalait tout, et la
      # protection annoncait donc un garde qui n'en etait pas un.
      #
      # Retirer le `|| true` d'un coup aurait rendu `main` rouge : mesure du
      # 2026-08-29, 33 findings au niveau exige (-ll -ii), dont 1 HIGH/HIGH.
      # On fige donc le compte et on interdit qu'il MONTE — meme parti que
      # `tests/contract_baselines/css_used_undefined.json` et que le budget de
      # taille des fonctions.
      #
      # Une BAISSE fait aussi echouer, avec le nouveau chiffre a inscrire : un
      # gain non verrouille se reperd. C'est deliberement le meme comportement
      # que `test_allowlist_has_no_stale_entries`.
      #
      # Le compte se lit dans le SARIF deja produit — verifie identique au
      # comptage JSON (33 = 33), donc pas de second passage de bandit.
      - name: Cliquet — le nombre de findings ne doit pas bouger
        if: always()
        run: |
          python - <<'PY'
          import json, sys

          # 33 -> 32 le 2026-08-31 : le SEUL finding de niveau `error` du lot,
          # B324 sur `_tmdb_api_key_fingerprint`, a ete resolu par MIGRATION
          # vers SHA-256 — pas par annotation. Mesure faite avec bandit 1.9.4 et
          # les drapeaux ci-dessous : 33 avant, 32 apres, et B324 disparait de
          # la ventilation par regle. Reste {B104: 4, B310: 1, B608: 27}.
          PLAFOND = 32  # mesure du 2026-08-31, bandit>=1.7,<2, drapeaux ci-dessus

          with open("bandit-results.sarif", encoding="utf-8") as fh:
              sarif = json.load(fh)
          n = sum(len(run.get("results", [])) for run in sarif.get("runs", []))
          print(f"bandit : {n} finding(s), plafond {PLAFOND}")

          if n > PLAFOND:
              sys.exit(
                  f"REGRESSION : {n} findings pour un plafond de {PLAFOND}. "
                  "Corriger le nouveau finding, ou (si justifie) monter PLAFOND "
                  "dans .github/workflows/bandit.yml — ce qui doit rester un "
                  "choix explicite en review."
              )
          if n < PLAFOND:
              sys.exit(
                  f"GAIN A VERROUILLER : {n} findings, le plafond en annonce "
                  f"{PLAFOND}. Abaisser PLAFOND a {n} dans "
                  ".github/workflows/bandit.yml pour que ce gain ne se reperde pas."
              )
          PY
