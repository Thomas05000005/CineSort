name: Dependabot auto-merge

# Auto-merge automatique des PRs Dependabot SI :
# 1. C'est un patch (1.2.3 -> 1.2.4) ou minor securite
# 2. Tous les CI checks passent vert
#
# Les bumps MAJEURS (1.x -> 2.x) restent en review manuelle car risque
# de breaking changes (cf pywebview 5 -> 6 dans la beta).

on: pull_request

permissions:
  contents: read

jobs:
  auto-merge:
    name: Auto-merge safe Dependabot updates
    runs-on: ubuntu-latest
    timeout-minutes: 5
    # Seulement pour les PRs Dependabot
    if: github.event.pull_request.user.login == 'dependabot[bot]'
    permissions:
      contents: write  # squash merge sur main
      pull-requests: write  # approve + auto-merge

    steps:
      - name: Get Dependabot metadata
        id: meta
        uses: dependabot/fetch-metadata@25dd0e34f4fe68f24cc83900b1fe3fe149efef98 # v3.1.0
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}

      # L'ETAPE « Auto-approve » A ETE RETIREE le 2026-08-19, apres avoir echoue
      # a CHAQUE execution depuis sa creation :
      #
      #   failed to create review: GraphQL: GitHub Actions is not permitted to
      #   approve pull requests. (addPullRequestReview)
      #
      # Elle etait impossible ET inutile, deux raisons independantes :
      #   - impossible : `can_approve_pull_request_reviews` vaut `false` sur ce
      #     depot, et c'est un reglage d'organisation, pas du workflow ;
      #   - inutile : la protection de `main` exige **0 revue**
      #     (`required_approving_review_count: 0`), donc rien n'attendait cette
      #     approbation pour fusionner.
      #
      # Son seul effet etait de rendre ce job ROUGE sur chaque PR Dependabot —
      # un check rouge permanent qu'on apprend a ignorer, ce qui masque les vrais.
      # Si une revue devient un jour requise, l'approbation devra venir d'une
      # identite qui en a le droit (GitHub App dediee), pas de `GITHUB_TOKEN`.

      - name: Enable auto-merge
        if: |
          steps.meta.outputs.update-type == 'version-update:semver-patch' ||
          (steps.meta.outputs.update-type == 'version-update:semver-minor' && steps.meta.outputs.dependency-type == 'direct:development') ||
          contains(steps.meta.outputs.dependency-group, 'security')
        run: gh pr merge --auto --squash "$PR_URL"
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
