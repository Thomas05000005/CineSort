name: PR title linter

# Verifie que le titre de la PR suit la convention "Conventional Commits"
# (feat:, fix:, docs:, ci:, refactor:, test:, chore:, perf:, build:).
#
# Le titre est utilise par :
# - Release Drafter (categorise dans les release notes)
# - Auto-label (autolabeler matche sur le prefix)
# - Squash merge (le titre devient le message de commit)
#
# Si non conforme : la PR ne peut pas etre mergee (status check fail).

on:
  pull_request:
    types:
      - opened
      - edited
      - synchronize
      - reopened

permissions:
  pull-requests: read

concurrency:
  # Un nouveau push sur une PR rend le run precedent sans objet : on l'annule
  # au lieu de le laisser occuper un slot. Mesure du 2026-08-03 : 247 runs
  # perimes sur 999 en file, pour 16 slots d'execution.
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  # Sur main, au contraire, on laisse le run aller au bout : c'est la reference.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  validate:
    name: Validate PR title
    runs-on: ubuntu-latest
    timeout-minutes: 2

    steps:
      - uses: amannn/action-semantic-pull-request@48f256284bd46cdaab1048c3721360e808335d50 # v6.1.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          types: |
            feat
            fix
            docs
            ci
            refactor
            test
            chore
            perf
            build
            style
            revert
            deps
            # Ajoutes le 2026-08-03. Le bot d'audit produit ces deux types depuis
            # des mois et ils portent une information que `fix` dilue : `sec` =
            # correctif de securite (CWE identifie), `rel` = fiabilite (ecriture
            # atomique, fsync, course entre ecrivains). Ils n'etaient pas dans la
            # liste, donc le check OBLIGATOIRE « Validate PR title » recalait ces
            # PR quelle que soit la qualite du code : 11 PR ouvertes bloquees pour
            # cette seule raison, dont 3 correctifs de securite. Les autoriser vaut
            # mieux que renommer au cas par cas — la convention existe deja dans
            # les faits, et le renommage effacerait le signal.
            sec
            rel
          requireScope: false
          subjectPattern: ^[A-Za-z0-9_].+$
          subjectPatternError: |
            Le titre apres le prefix doit commencer par une lettre/chiffre.

            Exemple correct : "feat: ajout export Trakt"
            Exemple incorrect : "feat: !!! ajout export"
          validateSingleCommit: false  # ne pas valider chaque commit, juste le titre PR
          # Tolere "BREAKING CHANGE: ..." comme suffix pour signal majeur
