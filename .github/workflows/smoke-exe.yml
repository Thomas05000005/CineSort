name: smoke-exe

# Tests E2E niveau 2 : build PyInstaller + smoke EXE.
# Triggerable manuellement (workflow_dispatch) car le build PyInstaller
# dure ~10 minutes. NE PAS lancer sur chaque push.
#
# Voir docs/internal/E2E_TESTS.md et tests/e2e/smoke_exe.py.

on:
  workflow_dispatch:
  # Optionnel : decommenter pour activer sur les tags v* (release pipeline)
  # push:
  #   tags:
  #     - "v*"

permissions:
  contents: read

jobs:
  smoke:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6

      - name: Setup Python 3.13
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v6
        with:
          python-version: "3.13"

      - name: Setup uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          cache-dependency-glob: |
            **/requirements*.txt
            **/pyproject.toml
            **/uv.lock

      - name: Install build dependencies
        shell: pwsh
        run: |
          uv pip install --system -r requirements-build.txt

      - name: Build PyInstaller EXE
        shell: pwsh
        run: |
          pyinstaller CineSort.spec --clean --noconfirm

      - name: Verify EXE artifact
        shell: pwsh
        run: |
          if (-not (Test-Path "dist\CineSort.exe")) {
            Write-Error "dist\CineSort.exe absent apres build"
            exit 1
          }
          $size = (Get-Item "dist\CineSort.exe").Length / 1MB
          Write-Host "EXE size: $size MB"

      - name: Run smoke EXE test (mode --api)
        shell: pwsh
        run: |
          python tests/e2e/smoke_exe.py --api --wait 20

      - name: Upload EXE artifact on failure
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: cinesort-exe-failure
          path: dist/CineSort.exe
          retention-days: 3
